name: Performance Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write # Required for the action to push results to gh-pages

jobs:
  benchmark:
    name: Run Python Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-benchmark psutil
          # Install your project here if necessary (ex: pip install .)
          pip install -e .

      - name: Run benchmarks
        run: |
          # Generate the JSON file required by the action
          pytest --benchmark-json output.json tests/test_performance_benchmarks.py

      - name: Store and compare benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'pytest' # Indicate to the action that we use pytest-benchmark
          output-file-path: output.json
          # Publish results on GitHub Pages for graphs
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Alert if performance drops by more than 20%
          fail-on-alert: true
          alert-threshold: '120%'
          comment-on-alert: true
